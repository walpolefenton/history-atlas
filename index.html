<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive atlas of world history: borders, capitals and major events from prehistory to today." />
    <title>History Atlas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%239a5b13'/%3E%3Cpath d='M2 16h28M16 2c-5 4-5 24 0 28M16 2c5 4 5 24 0 28' stroke='%23fffdf8' stroke-width='2' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <a class="skip-link" href="#panel">Skip to details</a>

    <header class="topbar">
      <div class="brand">
        <h1>History Atlas</h1>
        <p class="year-display" id="year-display" aria-live="polite"></p>
      </div>

      <div class="search" id="search">
        <label for="search-input" class="visually-hidden">Search territories and events</label>
        <input
          id="search-input"
          type="search"
          placeholder="Search territories and events…"
          autocomplete="off"
          role="combobox"
          aria-expanded="false"
          aria-controls="search-results"
          aria-autocomplete="list"
        />
        <ul id="search-results" role="listbox" aria-label="Search results" hidden></ul>
      </div>

      <div class="toolbar">
        <button type="button" id="btn-overview" class="tool">Overview</button>
        <button type="button" id="btn-list" class="tool">All territories</button>
        <button type="button" id="btn-compare" class="tool" aria-pressed="false">Compare</button>
        <button type="button" id="btn-projection" class="tool" aria-pressed="true">Globe</button>
      </div>
    </header>

    <main class="layout">
      <div class="map-pane" id="pane-a">
        <div id="map" role="region" aria-label="Historical world map. Use the arrow keys to pan and plus or minus to zoom. The details panel lists everything on the map as text."></div>
        <p class="map-badge" id="map-a-year" aria-hidden="true"></p>
      </div>
      <div class="map-pane" id="pane-b">
        <div id="map-b" role="region" aria-label="Comparison map"></div>
        <div class="map-badge compare-controls">
          <button type="button" id="compare-prev" class="mini-btn" aria-label="Earlier comparison year">‹</button>
          <label for="compare-year" class="visually-hidden">Compare with year</label>
          <select id="compare-year"></select>
          <button type="button" id="compare-next" class="mini-btn" aria-label="Later comparison year">›</button>
        </div>
      </div>
      <aside id="panel" class="panel" tabindex="-1" aria-label="Details"></aside>
    </main>

    <footer class="timeline" aria-label="Timeline">
      <div class="timeline-controls">
        <button type="button" id="btn-prev" class="icon-btn" aria-label="Previous snapshot">‹</button>
        <button type="button" id="btn-play" class="icon-btn" aria-label="Play through time" aria-pressed="false">▶</button>
        <button type="button" id="btn-next" class="icon-btn" aria-label="Next snapshot">›</button>
      </div>
      <div class="timeline-track">
        <label for="year-slider" class="visually-hidden">Year</label>
        <input type="range" id="year-slider" min="0" max="0" step="1" value="0" />
        <div class="ticks" id="ticks" aria-hidden="true"></div>
      </div>
    </footer>

    <div id="tooltip" class="tooltip" role="presentation" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
